name: levio
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  camera: ^0.12.0+1
  equatable: ^2.0.8
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_bloc: ^9.1.1
  google_mlkit_pose_detection: ^0.14.1
  shake: ^3.0.0
  shared_preferences: ^2.5.5
  speech_to_text: ^7.3.0
  firebase_ai: ^3.10.0
  firebase_core: ^4.6.0
  cloud_firestore: ^6.2.0
  firebase_auth: ^6.3.0
  adaptive_platform_ui: ^0.1.104
  audioplayers: ^6.6.0
  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.14.4
  in_app_review: ^2.0.11
  signature: ^6.3.0
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^7.0.1
  crypto: ^3.0.7
  superwallkit_flutter: ^2.4.11
  firebase_functions: ^0.0.1-dev
  cloud_functions: ^6.2.0
  time_picker_spinner: ^1.0.2
  intl: ^0.20.2
  file_picker: ^11.0.2
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
  macos:
    generate: true
    image_path: "assets/app_icon.png"

flutter_native_splash:
  color: "#17093F"
  image: assets/icon.png
  android: true
  ios: true

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/icon.png
    - assets/app_icon.png
    - shorebird.yaml
