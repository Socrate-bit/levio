name: levio
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.17+1

environment:
  sdk: ^3.11.4

dependencies:
  camera: ^0.12.0+1
  equatable: ^2.0.8
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_bloc: ^9.1.1
  google_mlkit_pose_detection: ^0.14.1
  shake: ^3.0.0
  shared_preferences: ^2.5.5
  speech_to_text: ^7.3.0
  firebase_ai: ^3.10.0
  firebase_core: ^4.6.0
  cloud_firestore: ^6.2.0
  firebase_auth: ^6.3.0
  adaptive_platform_ui: ^0.1.104
  audioplayers: ^6.7.1
  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.14.4
  in_app_review: ^2.0.11
  signature: ^6.3.0
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^7.0.1
  crypto: ^3.0.7
  superwallkit_flutter: ^2.4.11
  uuid: ^4.5.1
  firebase_functions: ^0.0.1-dev
  cloud_functions: ^6.2.0
  time_picker_spinner: ^1.0.2
  intl: ^0.20.2
  file_picker: ^11.0.2
  path_provider: ^2.1.5
  url_launcher: ^6.3.1
  liquid_glass_bar:
    path: packages/liquid_glass_bar
  device_preview: ^1.3.1
  flutter_screenutil: ^5.9.3
  mocktail: ^1.0.5
  bloc_test: ^10.0.0
  confetti: ^0.8.0
  mixpanel_flutter: ^2.9.0
  mixpanel_flutter_session_replay: ^0.1.0-beta.4
  permission_handler: ^12.0.3
  flutter_branch_sdk: ^9.3.1
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.0
  flutter_timezone: ^4.1.1
  firebase_storage: ^13.4.3
  video_player: ^2.11.1
  emoji_picker_flutter: ^4.4.0
  liquid_glass_widgets: ^0.18.4
  flame: ^1.37.0
  flame_audio: ^2.12.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: false
  ios: true
  image_path: "assets/app_icon.png"
  macos:
    generate: true
    image_path: "assets/app_icon.png"

flutter_native_splash:
  color: "#17093F"
  image: assets/icon.png
  android: false
  ios: true

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/alarm_set/Clock/
    - assets/alarm_set/Gentle/
    - assets/alarm_set/Musical/
    - assets/alarm_set/Ringstone/
    - assets/alarm_set/Violent/
    - assets/icon.png
    - assets/app_icon.png
    - assets/streaks.png
    - assets/trophy.png
    - assets/streak_badges/
    - assets/siren.png
    - assets/animations/
    - assets/onboarding/
    - assets/onboarding/profil_comments/
    - assets/icon_missions/
    - shorebird.yaml
    - assets/exemple.png
    - assets/wheel_moving.png
    - assets/wheel_static.png
    - assets/flappybird/sprites/
    - assets/flappybird/spritesV2/
    - assets/flappybird/audios/
